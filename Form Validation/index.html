<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="head">
            <h1>Signup</h1>
        </div>
        <form action="#">
            <div class="name">
                <label for="name">FullName</label>
                <input type="text" placeholder="Enetr FullName.." id="name" required>
                <i class="bi"></i>
                <!-- <i class="bi bi-x" id="wrong"></i> -->
                <span id="nameError"></span>
            </div>
            <div class="email">
                <label for="emailid">Email</label>
                <input type="email" placeholder="ENter email...." id="emailid" required>
                <i class="bi"></i>
                <span id="mailError"></span>
            </div>
            <div class="password">
                <label for="pwd">Password</label>
                <input type="password" placeholder="Enter password" id="pwd" required min="8" max="30">
                <i class="bi"></i>
                <span id="pwdError"></span>
            </div>
            <div class="button">
                <button type="submit" id="submitBtn">Create Account</button>
            </div>
        </form>
        <div class="login">
            <p>Already have an account?<span><a href="#">Login</a></span></p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
