<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary.com</title>
</head>
<body>
    <div class="container">
        <div class="search-form">
            <input type="text" placeholder="type here...">
            <button>Search</button>
        </div>

        <div class="dictionary-app">
            <div class="card">
                <div class="property">
                    <span>Word:</span>
                </div>

                <div class="property">
                    <span>Phonetics:</span>
                </div>

                <div class="property">
                    <span>Audio:</span>
                </div>

                <div class="property">
                    <span>Definition:</span>
                </div>

                <div class="property">
                    <span>Example:</span>
                </div>

                <div class="property">
                    <span>Parts of Speech:</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
