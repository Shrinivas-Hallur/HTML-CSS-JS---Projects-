<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="  Enter Location name" id="inp-city" spellcheck="false">
            <button id="search-img"><img src="images/search.png" alt=""></button>
        </div>
        <div class="error-msg">
            <p>Invalid City Name</p>
        </div>
        <div class="weather">
            <img src="images/clear.png" alt="" class="weather-img" id="temp-icon">
            <h1 class="temp" id="temp">22<sup>o</sup>C</h1>
            <h2 class="city" id="city-name">Hubli</h2>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="">
                <div class="Humidity">
                    <p id="humid">50%</p>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="col">
                <img src="images/wind.png" alt="">
                <div class="wind">
                    <p id="wind-speed">6.5 kmph</p>
                    <p>Windspeed</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
