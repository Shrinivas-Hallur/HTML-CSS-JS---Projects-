<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paswword Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="main-container">

    <div class="head">
        <h1>Password Generator</h1>
    </div>
        

        <div class="password-box">
            <input id="inp-txt" type="text" placeholder="Enter password...">
            <i class="bi bi-copy" id="copyBtn" title="copy_content"></i>
        </div>

        <input type="range" id="range1" min="1" max="30" value="8">
        
        <div class="range-box">
            <p>Password Length</p>
            <span id="range-value">8</span>
        </div>

        <div class="range-box">
            <label for="lower">Include LowerCase (a-z)</label>
            <input type="checkbox" id="lower" checked>
        </div>

        <div class="range-box">
            <label for="upper">Include UpperCase (A-Z)</label>
            <input type="checkbox" id="upper" checked>
        </div>

        <div class="range-box">
            <label for="numbers">Include Numbers (0-9)</label>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="range-box">
            <label for="symbol">Include Symbols (@#&)</label>
            <input type="checkbox" id="symbol" checked>
        </div>

        <button id="generate" type="button">Generate Password</button>
    </div>
 
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
