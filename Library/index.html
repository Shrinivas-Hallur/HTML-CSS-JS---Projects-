<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Library</h1>
        <button id="new-book-btn">
            + New Book
        </button>

        <button id="undo-btn">
            Undo
        </button>
    </header>
    
    <main>
        <div id="library-container">

        </div>
    </main>

    <dialog id="book-dialog">
        <form action="" id="book-form">
            <h2>Add new Book</h2>

            <input 
            type="text"
            id="title"
            placeholder="Book Title"
            required
            >

            <input 
            type="text"
            id="author"
            placeholder="Author"
            required
            >

            <input 
            type="text"
            id="pages"
            placeholder="Pages"
            required
            >

            <label>
                <input type="checkbox" id="read">
                Already Read
            </label>

            <div>
                <button type="submit">
                    Add Book
                </button>

                <button
                type="button"
                id="close-dialog"
                >
                    Cancel
                </button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
