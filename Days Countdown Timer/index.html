<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>We are Coming Soon!</h1>
    <div class="container">
        <div class="days" id="days">
          <span id="day">45</span>
          <span class="label"><Del></Del>Days</span>
        </div>
        <div class="hours" id="hours">
            <span id="hour">56</span>
             <span class="label">Hours</span> 
        </div>
        <div class="minutes" id="min">
            <span id="mins">66</span>
            <span class="label">Minutes</span>              
        </div>
        <div class="seconds" id="second">
            <span id="seconds">54</span>
            <span class="label">Seconds</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
