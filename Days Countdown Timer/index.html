<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

            56

            66                  
        </div>
        <div class="seconds" id="seconds">
            78
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
