<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <header>
        <h1>Rock🪨 Paper📃 Scissors✂️</h1>
     </header>
     <div class="score-board">
        <div class="badge" id="user-badge">User</div>
        <div class="badge" id="comp-badge">Comp</div>
        <p><span id="user-score">0</span>:<span id="comp-score">0</span></p>
    </div>

    <div class="result">
        <p>Paper covers Rock. You Win</p>
    </div>

    <div class="choices">
        <div class="choice" id="r">
            <img src="images/rock-paper-scissors-icon-set-on-white-background-vector.jpg" alt="">
        </div>
        <div class="choice" id="p">
            <img src="images/rock-paper-scissors-icon-set-on-white-background-vector (1).jpg" alt="">
        </div>
        <div class="choice" id="s">
            <img src="images/rock-paper-scissors-icon-set-on-white-background-vector (2).jpg" alt="">
        </div>
    </div>

    <p id="action-msg">It's your turn, Make your move</p>

    <script src="script.js" type="module"></script>
</body>
</html>
